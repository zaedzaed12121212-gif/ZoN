<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZON — تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: rgba(6, 182, 212, 0.3);
    }

    body {
      background: #090912;
      color: #f4f4ff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #131324;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 20px;
    }

    h1 {
      color: #a3e635;
      text-align: center;
      font-size: 32px;
      margin-bottom: 6px;
    }

    .sub {
      text-align: center;
      color: #a5a5c8;
      font-size: 13px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c7c7e2;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #1c1c34;
      color: #fff;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      touch-action: manipulation;
    }

    .btn-main {
      background: #7c3aed;
      color: #fff;
    }

    .btn-cyan {
      background: #06b6d4;
      color: #061014;
    }

    .btn-lime {
      background: #a3e635;
      color: #0b1102;
    }

    .btn-dark {
      background: #252542;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .row-2 {
      display: flex;
      gap: 10px;
    }

    .row-2 .btn {
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .msg-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #1b1b30;
      border: 1px solid #06b6d4;
      font-size: 14px;
      line-height: 1.6;
    }

    .card-item {
      background: #1b1b30;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="loginView" class="box">
    <h1>ZON</h1>
    <div class="sub">إدارة الطلبات والفرق والصيانة</div>

    <div class="row-2">
      <button id="tabLogin" type="button" class="btn btn-main">تسجيل الدخول</button>
      <button id="tabReg" type="button" class="btn btn-dark">حساب جديد</button>
    </div>

    <div id="regNameWrap" class="hidden">
      <label>الاسم الكامل</label>
      <input id="fullName" type="text" placeholder="اكتب اسمك" />
    </div>

    <label>البريد الإلكتروني</label>
    <input id="emailInp" type="email" placeholder="example@mail.com" />

    <label>كلمة المرور</label>
    <input id="passInp" type="password" placeholder="••••••••" />

    <button id="submitAuthBtn" type="button" class="btn btn-cyan">دخول إلى ZON</button>
    <button id="demoOwnerBtn" type="button" class="btn btn-lime">دخول تجريبي كمالك</button>

    <div id="statusMsg" class="msg-box hidden"></div>
  </div>

  <div id="appView" class="box hidden">
    <h1>ZON</h1>
    <div id="userInfo" class="sub"></div>

    <label>إضافة طلب جديد</label>
    <input id="orderTitle" type="text" placeholder="مثال: صيانة لوحة أو تمديد كهرباء" />
    <input id="orderArea" type="text" placeholder="المنطقة / العنوان" style="margin-top:8px;" />
    <button id="addOrderBtn" type="button" class="btn btn-lime">إضافة الطلب</button>

    <div id="ordersContainer"></div>

    <button id="logoutBtn" type="button" class="btn btn-dark" style="margin-top:18px;">تسجيل الخروج</button>
  </div>

  <script>
    (function () {
      var mode = "login";
      var orders = [
        { title: "فحص لوحة كهرباء وتوزيع أحمال", area: "النجف" }
      ];

      function byId(id) {
        return document.getElementById(id);
      }

      function showStatus(text) {
        var el = byId("statusMsg");
        el.textContent = text;
        el.classList.remove("hidden");
      }

      function openApp(userName, roleLabel) {
        byId("loginView").classList.add("hidden");
        byId("appView").classList.remove("hidden");
        byId("userInfo").textContent = "المستخدم: " + userName + " (" + roleLabel + ")";
        renderOrders();
      }

      function renderOrders() {
        var wrap = byId("ordersContainer");
        if (!orders.length) {
          wrap.innerHTML = '<div class="card-item">لا توجد طلبات حالياً.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < orders.length; i++) {
          html += '<div class="card-item"><strong>' + escapeText(orders[i].title) + '</strong><div style="color:#a5a5c8;font-size:13px;margin-top:4px;">الموقع: ' + escapeText(orders[i].area || "غير محدد") + '</div></div>';
        }
        wrap.innerHTML = html;
      }

      function escapeText(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      byId("tabLogin").addEventListener("click", function () {
        mode = "login";
        byId("tabLogin").className = "btn btn-main";
        byId("tabReg").className = "btn btn-dark";
        byId("regNameWrap").classList.add("hidden");
        byId("submitAuthBtn").textContent = "دخول إلى ZON";
      });

      byId("tabReg").addEventListener("click", function () {
        mode = "register";
        byId("tabReg").className = "btn btn-main";
        byId("tabLogin").className = "btn btn-dark";
        byId("regNameWrap").classList.remove("hidden");
        byId("submitAuthBtn").textContent = "إنشاء حساب";
      });

      byId("submitAuthBtn").addEventListener("click", function () {
        var email = (byId("emailInp").value || "").trim();
        var pass = (byId("passInp").value || "").trim();
        var name = (byId("fullName").value || "").trim();

        if (!email || !pass) {
          showStatus("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
          return;
        }
        if (mode === "register" && !name) {
          showStatus("يرجى كتابة الاسم الكامل لإنشاء الحساب.");
          return;
        }
        openApp(name || email, mode === "register" ? "حساب جديد" : "مستخدم");
      });

      byId("demoOwnerBtn").addEventListener("click", function () {
        openApp("مالك النظام", "مالك");
      });

      byId("addOrderBtn").addEventListener("click", function () {
        var title = (byId("orderTitle").value || "").trim();
        var area = (byId("orderArea").value || "").trim();
        if (!title) {
          alert("اكتب عنوان الطلب أولاً.");
          return;
        }
        orders.unshift({ title: title, area: area });
        byId("orderTitle").value = "";
        byId("orderArea").value = "";
        renderOrders();
      });

      byId("logoutBtn").addEventListener("click", function () {
        byId("appView").classList.add("hidden");
        byId("loginView").classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
