<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZON — إدارة الطلبات والفرق</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: rgba(6, 182, 212, 0.3);
    }

    body {
      background: #080811;
      color: #f4f4ff;
      min-height: 100vh;
      padding: 16px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: #131324;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .logo {
      color: #a3e635;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
    }

    .sub {
      color: #a5a5c8;
      font-size: 13px;
      text-align: center;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c9c9e6;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #1b1b32;
      color: #fff;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .btn-violet { background: #7c3aed; color: #fff; }
    .btn-cyan { background: #06b6d4; color: #051014; }
    .btn-lime { background: #a3e635; color: #091002; }
    .btn-pink { background: #ec4899; color: #fff; }
    .btn-dark { background: #242440; color: #fff; border: 1px solid rgba(255,255,255,0.15); }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row .btn, .tab-btn {
      flex: 1;
      min-width: 90px;
    }

    .tab-btn {
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #1a1a30;
      color: #b7b7d8;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }

    .tab-btn.active {
      background: #7c3aed;
      color: #fff;
      border-color: #06b6d4;
    }

    .hidden { display: none; }

    .item {
      background: #1b1b32;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 11px;
      margin-top: 10px;
    }

    .small {
      font-size: 12px;
      color: #a5a5c8;
      margin-top: 4px;
    }

    .notice {
      background: #1d1b36;
      border: 1px solid #06b6d4;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- شاشة الدخول -->
    <div id="loginBox" class="card">
      <div class="logo">ZON</div>
      <div class="sub">إدارة الطلبات والفرق والصيانة</div>

      <div class="row">
        <button id="btnModeLogin" type="button" class="btn btn-violet">دخول</button>
        <button id="btnModeReg" type="button" class="btn btn-dark">حساب جديد</button>
      </div>

      <div id="regFields" class="hidden">
        <label>الاسم الكامل</label>
        <input id="inpName" type="text" placeholder="اكتب اسمك" />

        <label>الصفة المطلوبة</label>
        <select id="selRole">
          <option value="فني ميداني">فني ميداني</option>
          <option value="مشرف">مشرف</option>
        </select>
      </div>

      <label>البريد الإلكتروني</label>
      <input id="inpEmail" type="email" placeholder="example@mail.com" />

      <label>كلمة المرور</label>
      <input id="inpPass" type="password" placeholder="••••••••" />

      <button id="btnSubmitAuth" type="button" class="btn btn-cyan">دخول إلى ZON</button>
      <button id="btnDemoOwner" type="button" class="btn btn-lime">دخول سريع كمالك</button>

      <div id="authNotice" class="notice hidden"></div>
    </div>

    <!-- شاشة التطبيق بعد الدخول -->
    <div id="appBox" class="hidden">
      <div class="card">
        <div class="logo" style="font-size:24px; text-align:right;">ZON</div>
        <div id="userBar" class="small" style="font-size:13px; color:#e2e2ff;"></div>

        <div class="row">
          <button type="button" class="tab-btn active" data-tab="orders">الطلبات</button>
          <button type="button" class="tab-btn" data-tab="chat">الدردشة</button>
          <button type="button" class="tab-btn" data-tab="notes">المذكرات</button>
          <button type="button" class="tab-btn" data-tab="settings">الإعدادات</button>
        </div>
      </div>

      <!-- تبويب الطلبات -->
      <div id="sec-orders" class="card">
        <h3 style="color:#06b6d4;">إضافة طلب جديد</h3>
        <label>نوع العمل / العنوان</label>
        <input id="ordTitle" type="text" placeholder="مثال: فحص لوحة ATS أو صيانة كهرباء" />

        <label>المنطقة / الموقع</label>
        <input id="ordArea" type="text" placeholder="مثال: النجف - حي الأمير" />

        <label>الفني المسؤول</label>
        <input id="ordTech" type="text" placeholder="مثال: علي حسن" />

        <button id="btnAddOrder" type="button" class="btn btn-lime">حفظ الطلب</button>
        <div id="ordersList"></div>
      </div>

      <!-- تبويب الدردشة -->
      <div id="sec-chat" class="card hidden">
        <h3 style="color:#ec4899;">دردشة الفريق</h3>
        <div id="chatList"></div>
        <label>رسالة جديدة</label>
        <input id="chatInp" type="text" placeholder="اكتب رسالتك هنا..." />
        <button id="btnSendChat" type="button" class="btn btn-pink">إرسال الرسالة</button>
      </div>

      <!-- تبويب المذكرات -->
      <div id="sec-notes" class="card hidden">
        <h3 style="color:#a3e635;">المذكرات والملاحظات</h3>
        <label>عنوان المذكرة</label>
        <input id="noteTitle" type="text" placeholder="مثال: نواقص مواد" />

        <label>التفاصيل</label>
        <textarea id="noteBody" rows="3" placeholder="اكتب ملاحظتك هنا..."></textarea>

        <button id="btnAddNote" type="button" class="btn btn-lime">إضافة مذكرة</button>
        <div id="notesList"></div>
      </div>

      <!-- تبويب الإعدادات و Firebase -->
      <div id="sec-settings" class="card hidden">
        <h3 style="color:#06b6d4;">إعدادات النظام وقاعدة البيانات (Firebase)</h3>
        <label>إعدادات Firebase Config</label>
        <textarea id="fbConfigInp" rows="5" placeholder='{"apiKey":"...","authDomain":"...","projectId":"..."}'></textarea>
        <button id="btnSaveFb" type="button" class="btn btn-cyan">حفظ إعدادات قاعدة البيانات</button>
        <div id="fbStatus" class="small">الحالة: وضع تجريبي محلي</div>
        <button id="btnLogout" type="button" class="btn btn-dark" style="margin-top:16px;">تسجيل الخروج</button>
      </div>
    </div>

  </div>

  <script>
    (function () {
      var mode = "login";
      var currentUser = { name: "مالك النظام", role: "مالك" };
      var fbConfigText = "";

      var orders = [
        { title: "فحص لوحة ATS وتبديل قاطع", area: "بغداد", tech: "فريق الصيانة" }
      ];

      var chats = [
        { sender: "النظام", text: "أهلاً بك في منصة ZON لإدارة الطلبات والفرق." }
      ];

      var notes = [
        { title: "تنبيه سلامة", body: "فصل التيار وقياس الفولتية قبل العمل على أي لوحة." }
      ];

      function el(id) {
        return document.getElementById(id);
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showNotice(msg) {
        var n = el("authNotice");
        n.textContent = msg;
        n.classList.remove("hidden");
      }

      function setMode(m) {
        mode = m;
        var isReg = m === "reg";
        el("btnModeLogin").className = isReg ? "btn btn-dark" : "btn btn-violet";
        el("btnModeReg").className = isReg ? "btn btn-violet" : "btn btn-dark";
        el("regFields").classList.toggle("hidden", !isReg);
        el("btnSubmitAuth").textContent = isReg ? "إنشاء حساب" : "دخول إلى ZON";
      }

      function enterApp(name, role) {
        currentUser = { name: name || "مستخدم ZON", role: role || "مالك" };
        el("userBar").textContent = "المستخدم: " + currentUser.name + " | الصفة: " + currentUser.role;
        el("loginBox").classList.add("hidden");
        el("appBox").classList.remove("hidden");
        renderAll();
      }

      function switchTab(tabName) {
        var btns = document.querySelectorAll(".tab-btn");
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle("active", btns[i].getAttribute("data-tab") === tabName);
        }
        var secs = ["orders", "chat", "notes", "settings"];
        for (var j = 0; j < secs.length; j++) {
          el("sec-" + secs[j]).classList.toggle("hidden", secs[j] !== tabName);
        }
      }

      function renderOrders() {
        var html = "";
        for (var i = 0; i < orders.length; i++) {
          html += '<div class="item">' +
            '<strong>' + esc(orders[i].title) + '</strong>' +
            '<div class="small">المنطقة: ' + esc(orders[i].area || "غير محدد") + ' • الفني: ' + esc(orders[i].tech || "غير معيّن") + '</div>' +
          '</div>';
        }
        el("ordersList").innerHTML = html;
      }

      function renderChats() {
        var html = "";
        for (var i = 0; i < chats.length; i++) {
          html += '<div class="item">' +
            '<strong>' + esc(chats[i].sender) + ':</strong> ' + esc(chats[i].text) +
          '</div>';
        }
        el("chatList").innerHTML = html;
      }

      function renderNotes() {
        var html = "";
        for (var i = 0; i < notes.length; i++) {
          html += '<div class="item">' +
            '<strong>' + esc(notes[i].title) + '</strong>' +
            '<div class="small" style="color:#e2e2ff;">' + esc(notes[i].body) + '</div>' +
          '</div>';
        }
        el("notesList").innerHTML = html;
      }

      function renderAll() {
        renderOrders();
        renderChats();
        renderNotes();
      }

      el("btnModeLogin").addEventListener("click", function () { setMode("login"); });
      el("btnModeReg").addEventListener("click", function () { setMode("reg"); });

      el("btnSubmitAuth").addEventListener("click", function () {
        var email = (el("inpEmail").value || "").trim();
        var pass = (el("inpPass").value || "").trim();
        var name = (el("inpName").value || "").trim();
        var role = el("selRole").value;

        if (!email || !pass) {
          showNotice("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
          return;
        }
        if (mode === "reg" && !name) {
          showNotice("يرجى كتابة الاسم الكامل.");
          return;
        }
        enterApp(name || email, mode === "reg" ? role : "مالك");
      });

      el("btnDemoOwner").addEventListener("click", function () {
        enterApp("مالك منصة ZON", "مالك");
      });

      var tabBtns = document.querySelectorAll(".tab-btn");
      for (var t = 0; t < tabBtns.length; t++) {
        tabBtns[t].addEventListener("click", function () {
          switchTab(this.getAttribute("data-tab"));
        });
      }

      el("btnAddOrder").addEventListener("click", function () {
        var title = (el("ordTitle").value || "").trim();
        var area = (el("ordArea").value || "").trim();
        var tech = (el("ordTech").value || "").trim();
        if (!title) {
          alert("اكتب عنوان الطلب أولاً.");
          return;
        }
        orders.unshift({ title: title, area: area, tech: tech });
        el("ordTitle").value = "";
        el("ordArea").value = "";
        el("ordTech").value = "";
        renderOrders();
      });

      el("btnSendChat").addEventListener("click", function () {
        var text = (el("chatInp").value || "").trim();
        if (!text) return;
        chats.push({ sender: currentUser.name, text: text });
        el("chatInp").value = "";
        renderChats();
      });

      el("btnAddNote").addEventListener("click", function () {
        var title = (el("noteTitle").value || "").trim();
        var body = (el("noteBody").value || "").trim();
        if (!title && !body) return;
        notes.unshift({ title: title || "مذكرة", body: body });
        el("noteTitle").value = "";
        el("noteBody").value = "";
        renderNotes();
      });

      el("btnSaveFb").addEventListener("click", function () {
        fbConfigText = (el("fbConfigInp").value || "").trim();
        el("fbStatus").textContent = fbConfigText
          ? "الحالة: تم حفظ إعدادات Firebase جاهزة للربط"
          : "الحالة: لم يتم إدخال إعدادات بعد";
        alert("تم حفظ الإعدادات.");
      });

      el("btnLogout").addEventListener("click", function () {
        el("appBox").classList.add("hidden");
        el("loginBox").classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
